[package]
name = "matier-pool"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Connection pool for Matier: h1 idle stack + waiter queue, h2 snapshot with power-of-two-choices"

[dependencies]
matier-core = { path = "../core" }
matier-transport = { path = "../transport" }
http = { workspace = true }
http-body = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
papaya = "0.2"
arc-swap = "1"
parking_lot = "0.13"
slab = "0.4"
futures-util = { version = "0.3", default-features = false }
rustc-hash = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "test-util"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
bytes = { workspace = true }
