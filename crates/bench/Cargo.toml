[package]
name = "matier-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Benchmark harness for HTTP clients: closed/open-loop drivers, process metrics, JSON reports"

[lib]
name = "matier_bench"
path = "src/lib.rs"

[[bin]]
name = "matier-bench"
path = "src/main.rs"

[features]
default = ["hyper-legacy", "hyper-pooled", "reqwest", "fetch", "matier", "count-allocs"]
hyper-legacy = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:hyper-rustls", "dep:rustls", "dep:tower-service"]
hyper-pooled = ["hyper-legacy"]
reqwest = ["dep:reqwest", "dep:rustls"]
# Microsoft oxidizer `fetch` (subjects: fetch, fetch-standard, fetch-pooled).
fetch = ["dep:fetch", "dep:http-body-util", "dep:rustls"]
# The Matier client under development (this repo).
matier = ["dep:matier", "dep:http-body"]
# Install a counting global allocator in the binary (adds a few ns per allocation).
count-allocs = []

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
hdrhistogram.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "signal"] }
toml.workspace = true

hyper = { workspace = true, optional = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, optional = true, features = ["client-legacy", "http1", "http2", "tokio"] }
http-body-util = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true, features = ["http1", "http2", "aws-lc-rs"] }
tower-service = { version = "0.3", optional = true }
rustls = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["rustls", "http2"] }
matier = { path = "../matier", optional = true }
http-body = { workspace = true, optional = true }
fetch = { version = "0.21.0", optional = true, features = ["tokio", "rustls"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
