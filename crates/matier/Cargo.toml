[package]
name = "matier"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true
description = "Matier: a high-performance HTTP/1.1 + HTTP/2 client for tokio"

[dependencies]
matier-core = { version = "0.2.1", path = "../core" }
matier-transport = { version = "0.2.1", path = "../transport" }
matier-pool = { version = "0.2.1", path = "../pool" }
http = { workspace = true }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
http-body = { workspace = true }
http-body-util = { workspace = true }
