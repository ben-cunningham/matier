[package]
name = "matier_fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true
description = "Matier as the transport for Microsoft's fetch HTTP client"

[dependencies]
matier = { version = "0.3.0", path = "../matier" }
fetch = { version = "0.21.0", default-features = false }
http_extensions = { version = "0.15.0", default-features = false }
thread_aware = { version = "0.12.2", default-features = false }
tick = { version = "0.9.1", default-features = false, features = ["tokio"] }
bytesbuf = { workspace = true }
layered = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
futures-util = { version = "0.3", default-features = false }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "server", "http1", "http2"] }
bytes = { workspace = true }
futures-util = { version = "0.3", default-features = false }
