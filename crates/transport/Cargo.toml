[package]
name = "matier-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true
description = "TCP, TLS and HTTP/1.1 and HTTP/2 connections for the Matier HTTP client"

[features]
default = ["aws-lc-rs"]
aws-lc-rs = ["rustls/aws_lc_rs", "tokio-rustls/aws_lc_rs"]
ring = ["rustls/ring", "tokio-rustls/ring"]
# Alternative rustls crypto backend: FIPS 140-3 validated SymCrypt instead of aws-lc-rs/ring. Needs
# the native SymCrypt library at build and run time; see `rustls_symcrypt`'s quick-start guide.
# Windows and Linux only (no macOS). Enable with `default-features = false, features = ["symcrypt"]`.
symcrypt = ["dep:rustls-symcrypt", "rustls/custom-provider"]
webpki-roots = ["dep:webpki-roots"]

[dependencies]
matier-core = { version = "0.1.0", path = "../core" }
matier-h1 = { version = "0.1.0", path = "../h1" }
http = { workspace = true }
http-body = { workspace = true }
futures-util = { version = "0.3", default-features = false }
tokio = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-platform-verifier = { workspace = true }
webpki-roots = { workspace = true, optional = true }
rustls-symcrypt = { version = "0.2", optional = true }
socket2 = { workspace = true }
matier-h2 = { version = "0.1.0", path = "../h2" }
bytes = { workspace = true }
atomic-waker = "1.1"
crossbeam-queue = "0.3"
slab = "0.4"

[dev-dependencies]
rcgen = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
hyper = { workspace = true, features = ["server", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "test-util"] }

[target.'cfg(matier_loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(matier_loom)"] }
