# Body-size sweep (~8 min): tiny requests/responses, then multi-megabyte downloads and uploads.
# Run: scripts/bench.sh bench/sizes.toml sizes
url = "http://127.0.0.1:8080"
tls_url = "https://127.0.0.1:8443"
ca_cert = "target/bench-server-cert.pem"
warmup = "1s"
duration = "3s"
cooldown = "500ms"

# Small: 64 B response (per-request overhead dominates).
[[group]]
subjects = ["matier", "hyper-legacy", "hyper-pooled", "fetch", "fetch-pooled"]
protocols = ["h1", "h2"]
concurrency = [64, 256]
resp_sizes = [64]
pool_size = 4

# Small: 64 B POST body (echo returns a short length string).
[[group]]
subjects = ["matier", "hyper-legacy", "hyper-pooled", "fetch", "fetch-pooled"]
protocols = ["h1", "h2"]
concurrency = [64, 256]
method = "POST"
path = "/echo"
req_sizes = [64]
pool_size = 4

# Large downloads: 1 MiB and 8 MiB responses.
[[group]]
subjects = ["matier", "hyper-legacy", "hyper-pooled", "fetch", "fetch-pooled"]
protocols = ["h1", "h2"]
concurrency = [8, 32]
resp_sizes = [1048576, 8388608]
pool_size = 4

# Large uploads: 1 MiB and 8 MiB POST bodies.
[[group]]
subjects = ["matier", "hyper-legacy", "hyper-pooled", "fetch", "fetch-pooled"]
protocols = ["h1", "h2"]
concurrency = [16]
method = "POST"
path = "/echo"
req_sizes = [1048576, 8388608]
pool_size = 4
