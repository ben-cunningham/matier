# Quick matrix for iteration loops (~50s). Run: scripts/bench.sh bench/quick.toml quick
url = "http://127.0.0.1:8080"
tls_url = "https://127.0.0.1:8443"
ca_cert = "target/bench-server-cert.pem"
warmup = "400ms"
duration = "1500ms"
cooldown = "200ms"

[[group]]
subjects = ["hyper-legacy", "hyper-pooled", "reqwest", "fetch", "fetch-standard", "fetch-pooled", "matier"]
protocols = ["h1", "h2"]
concurrency = [64]
resp_sizes = [1024]
pool_size = 4

[[group]]
subjects = ["hyper-legacy", "hyper-pooled", "reqwest", "fetch", "fetch-standard", "fetch-pooled", "matier"]
protocols = ["h2"]
tls = [true]
concurrency = [64]
resp_sizes = [1024]
pool_size = 4

[[group]]
subjects = ["hyper-legacy", "reqwest", "fetch", "fetch-pooled", "matier"]
protocols = ["h1"]
tls = [true]
concurrency = [64]
resp_sizes = [1024]
pool_size = 4

[[group]]
subjects = ["hyper-legacy", "hyper-pooled", "reqwest", "fetch", "matier"]
protocols = ["h1"]
rates = [10000.0]
resp_sizes = [1024]
pool_size = 4
