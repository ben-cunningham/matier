# Focused A/B for the known gaps (~3 min): large h2 bodies, 64 KiB, and c=64 small requests.
# Run: scripts/bench.sh bench/gaps.toml <name>
url = "http://127.0.0.1:8080"
warmup = "1s"
duration = "4s"
cooldown = "500ms"

[[group]]
subjects = ["matier", "hyper-pooled"]
protocols = ["h2"]
concurrency = [8]
resp_sizes = [1048576, 8388608]
pool_size = 4

[[group]]
subjects = ["matier", "hyper-pooled"]
protocols = ["h2"]
concurrency = [32]
resp_sizes = [1048576]
pool_size = 4

[[group]]
subjects = ["matier", "hyper-pooled"]
protocols = ["h2"]
concurrency = [64, 256]
resp_sizes = [1024, 65536]
pool_size = 4
